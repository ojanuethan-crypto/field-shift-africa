# Frontend on Netlify. The API runs on Render (see render.yaml).
# Set in Netlify > Site settings > Environment variables (baked in at build time):
#   VITE_USE_MOCK=false
#   VITE_API_URL=https://<your-api>.onrender.com   (no trailing slash)
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Single-page app: every path serves index.html (same rule as public/_redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
