# Render blueprint: the Flask API only. UNTESTED (no Render account/Docker was available while this was written):
# follow docs/DEPLOY.md and run backend/scripts/smoke.sh against the public URL before trusting it.
services:
  - type: web
    name: scifarm-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: prod
      - key: ENGINE_MODE
        value: real
      - key: DATABASE_URL        # Supabase SESSION POOLER string (IPv4), read-only user preferred. Paste in the Render dashboard.
        sync: false
      - key: ALLOWED_ORIGINS     # the Netlify URL, e.g. https://scifarm.netlify.app, no trailing slash (never *)
        sync: false
      - key: CACHE_BACKEND
        value: memory
      - key: ANTHROPIC_API_KEY   # optional: model wording for /api/ask and /api/explain
        sync: false

# The frontend is deployed on Netlify (see netlify.toml), not here.
